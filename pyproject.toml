[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "certpassly-exam-skill"
version = "0.1.0"
description = "Reusable evidence-first CertPassly exam workflow orchestration and QA"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CertPassly Team"}]
dependencies = []

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24,<2"]
visual = ["Pillow>=10,<13", "opencv-python-headless>=4.9,<5"]
browser = ["playwright>=1.50,<2"]
mcp = ["mcp>=1.3,<2"]
# phase1 pin note: the structured builder's text reading order on /Rotate 90 pages
# is version-sensitive; PyMuPDF 1.28.2 was observed diverging from the pinned
# extractor's ground truth on a rotated multi-question page (the builder's
# page-set cross-check BLOCKED the run). The validated line is 1.26.x
# (1.26.7 proven on two accepted pilots). Do not widen without a full
# adversarial + pilot replay.
phase1 = ["PyMuPDF>=1.26,<1.27", "Pillow>=10,<13", "numpy>=1.26,<3", "jsonschema>=4.20,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
certpassly = "certpassly.cli:main"
certpassly-mcp = "certpassly.mcp_server:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"certpassly.phase1" = ["templates/*.json"]
"certpassly.media_prep" = ["schemas/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
