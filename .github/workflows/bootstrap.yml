name: One-time public skill bootstrap
on:
  push:
    branches: [main]
    paths: [seed/seed.b64]
permissions:
  contents: write
concurrency:
  group: one-time-skill-bootstrap
  cancel-in-progress: false
jobs:
  extract-and-commit:
    if: github.repository == 'mathorax1-hue/certpassly-exam-skill'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack explicitly reviewed public source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, json
          bundle = base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in sorted(Path('seed').glob('chunk-*.txt'))), validate=True)
          files = json.loads(bz2.decompress(bundle).decode('utf-8'))
          assert isinstance(files, dict) and len(files) >= 20
          for rel, contents in files.items():
              path = Path(rel)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert isinstance(contents, str)
              path.parent.mkdir(parents=True, exist_ok=True)
              assert not path.exists(), f'Refusing to replace existing path: {path}'
              path.write_text(contents, encoding='utf-8')
          print(f'Extracted {len(files)} public source files')
          PY
      - name: Synthetic regression tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Remove one-time bootstrap helpers and check tracked files
        run: |
          rm -rf seed
          rm -f .github/workflows/bootstrap.yml
          git add -A
          python scripts/check_public_safety.py
      - name: Commit complete skill foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bootstrap CertPassly reusable skill v0.1.0 with tests'
          git push origin HEAD:main
