name: Independent V2 release gate tests
on:
  push:
    branches:
      - chatgpt/strict-v2-evidence-gates-20261115
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: python -m unittest discover -s tests -p 'test_site_v2_release_gate.py' -v
