name: CertPassly media-prep CI - synthetic image suite
on:
  push:
    branches: [main, "zai/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-prep-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media-prep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install image extras
        run: python -m pip install -e ".[phase1,visual]" && python -m pip check
      - name: Doctor (image environment must be ready)
        run: python -m certpassly.media_prep doctor
      - name: Run media-prep synthetic suites (no skips allowed)
        shell: bash
        run: |
          set -e
          out=$(python -m unittest tests.test_media_prep_inventory tests.test_media_prep_quality tests.test_media_prep_privacy tests.test_media_prep_e2e tests.test_media_prep_cli -v 2>&1 | tee /dev/stderr)
          echo "$out" | tail -1
          echo "$out" | grep -E "^(OK|FAILED)" | tail -1
          if echo "$out" | grep -q "^FAILED"; then exit 1; fi
          skipped=$(echo "$out" | tail -1 | sed -n 's/.*skipped=\([0-9]*\)).*/\1/p')
          if [ "${skipped:-0}" != "0" ]; then
            echo "ERROR: ${skipped} media-prep tests were SKIPPED in an environment where the image extras are installed"
            exit 1
          fi
      - name: Pinned real-upstream integration (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone https://github.com/msaqlainhaneef1/certpassly-exam-pipeline.git /tmp/upstream
          git -C /tmp/upstream checkout --detach 13dea6bab662ab1c4bbf87017e912e519907c8bc
          test "$(git -C /tmp/upstream rev-parse HEAD)" = "13dea6bab662ab1c4bbf87017e912e519907c8bc"
          CERTPASSLY_UPSTREAM_SCRIPTS=/tmp/upstream/scripts \
            python -m unittest tests.test_media_prep_e2e.RealUpstreamIntegrationTests -v
      - name: CLI walkthrough on the synthetic example
        shell: bash
        run: |
          set -e
          python tests/media_prep_fixture.py --out "$RUNNER_TEMP/mp-demo"
          cfg="$RUNNER_TEMP/mp-demo/media-prep-config.json"
          python -m certpassly.media_prep scan --config "$cfg" --explain || test $? -eq 2
          python -m certpassly.media_prep prepare --config "$cfg" --explain || test $? -eq 2
          ls "$RUNNER_TEMP/mp-demo/prepared/clean"
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - name: Registry, safety and compile checks
        shell: bash
        run: |
          python scripts/verify_tool_registry.py
          python scripts/check_public_safety.py
          python -m compileall -q scripts src
